# Prime Care — Exemple de configuration Nginx (HTTPS / PHP-FPM 8.2+)

server {
    listen 80;
    listen [::]:80;
    server_name primecare.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name primecare.example.org;

    # SEULE racine web exposée
    root /var/www/prime-care/public;
    index index.php;

    charset utf-8;
    client_max_body_size 6M;

    # Certificats TLS
    ssl_certificate     /etc/letsencrypt/live/primecare.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primecare.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Bloquer les fichiers cachés et sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(sql|ini|log|sh|bak|env|md)$ {
        deny all;
    }

    # Service worker : jamais mis en cache longue durée
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Assets statiques versionnés (?v=filemtime)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Front controller unique
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}
